<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik's New Year Card</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0202;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 2000px;
        }

        .card-wrapper {
            height: 60vh;
            cursor: pointer;
            /* 使用 CSS transition 來處理「回正」和「旋轉」，這比 JS 模擬穩定 */
            transition: transform 0.1s ease-out; 
            transform-style: preserve-3d;
            will-change: transform;
        }

        .card-image {
            height: 100%;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            pointer-events: none;
            display: block;
        }

        .text-container {
            margin-top: 3vh;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="card-wrapper" id="card">
        <img src="card_image.png" id="card-img" alt="Card" class="card-image">
    </div>

    <div class="text-container">
        <h1 id="main-title" style="margin: 0; font-size: 2rem;">Erik 祝大家新年快樂</h1>
        <p id="sub-title" style="opacity: 0.8;">Happy Lunar New Year</p>
    </div>

    <script>
        const card = document.getElementById('card');
        const cardImg = document.getElementById('card-img');
        const mainTitle = document.getElementById('main-title');
        const subTitle = document.getElementById('sub-title');

        const contents = [
            { img: 'card_image.png', t1: 'Erik 祝大家新年快樂', t2: 'Happy Lunar New Year' },
            { img: 'card_image_2.png', t1: '萬事如意 · 歲歲平安', t2: 'Prosperity and Peace' },
            { img: 'card_image_3.png', t1: '心想事成 · 福氣滿滿', t2: 'May All Your Wishes Come True' }
        ];

        let currentIndex = 0;
        let sparkleCount = 0;
        let degree = 0;
        let isSpinning = false; // 鎖定狀態開關

        // 1. 滑鼠跟隨效果
        document.addEventListener('mousemove', (e) => {
            if (isSpinning) return; // 如果正在旋轉，不准滑鼠干擾

            const xOffset = (e.clientX - window.innerWidth / 2) / 20;
            const yOffset = (e.clientY - window.innerHeight / 2) / 20;
            
            // 平時隨滑鼠微調
            card.style.transition = "transform 0.1s ease-out";
            card.style.transform = `rotateY(${degree + xOffset}deg) rotateX(${-yOffset}deg) translateZ(0)`;
        });

        // 2. 點擊旋轉門
        card.addEventListener('click', (e) => {
            if (isSpinning) return; // 防止連點打架

            isSpinning = true;
            degree += 360;

            // 啟動大旋轉，時間設為 1.2s 確保優雅
            card.style.transition = "transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1)";
            card.style.transform = `rotateY(${degree}deg) rotateX(0deg) translateZ(0)`;

            // 在旋轉過程中切換圖片
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % contents.length;
                cardImg.src = contents[currentIndex].img;
                mainTitle.innerText = contents[currentIndex].t1;
                subTitle.innerText = contents[currentIndex].t2;
            }, 300);

            // 旋轉結束後，解鎖讓滑鼠重新控制
            setTimeout(() => {
                isSpinning = false;
            }, 1200);

            createFirework(e.clientX, e.clientY);
        });

        // ✨ 煙火邏輯 (維持你要求的物理參數)
        function createFirework(x, y) {
            for (let i = 0; i < 20; i++) {
                if (sparkleCount >= 50) break;
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerHTML = '✨';
                document.body.appendChild(sparkle);
                sparkleCount++;

                const angle = Math.random() * Math.PI * 2;
                const velocity = 2.5 + Math.random() * 5; 
                let vx = Math.cos(angle) * velocity;
                let vy = Math.sin(angle) * velocity - 3; 
                let posX = x;
                let posY = y;
                let opacity = 1;
                let gravity = 0.2;

                function animateSparkle() {
                    posX += vx;
                    posY += (vy + gravity);
                    gravity += 0.35; 
                    opacity -= 0.01; 
                    sparkle.style.left = posX + 'px';
                    sparkle.style.top = posY + 'px';
                    sparkle.style.opacity = opacity;
                    sparkle.style.transform = `scale(${opacity}) rotate(${posX * 0.5}deg)`;
                    if (opacity > 0) { requestAnimationFrame(animateSparkle); } else { sparkle.remove(); sparkleCount--; }
                }
                animateSparkle();
            }
        }
    </script>
</body>
</html>
