<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erik's New Year Card</title>

<style>
body {
    margin: 0;
    background: #0d0202;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    perspective: 2000px;
}

/* 1️⃣ 滑鼠層 */
.tilt-layer {
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    transition: transform 0.15s ease-out;
    will-change: transform;
}

/* 2️⃣ 呼吸層 */
.breathe-layer {
    animation: breathe 6s ease-in-out infinite;
    transform-style: preserve-3d;
}

@keyframes breathe {
    0%   { transform: rotateY(-4deg) rotateX(2deg); }
    50%  { transform: rotateY(4deg) rotateX(-2deg); }
    100% { transform: rotateY(-4deg) rotateX(2deg); }
}

/* 3️⃣ 旋轉層 */
.spin-layer {
    height: 60vh;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(0.2,0.8,0.2,1);
    will-change: transform;
}

.card-image {
    height: 100%;
    border-radius: 15px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    display: block;
    pointer-events: none;
}

.text-container {
    margin-top: 3vh;
    text-align: center;
    color: white;
    font-family: sans-serif;
    pointer-events: none;
}

.sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    font-size: 24px;
}
</style>
</head>

<body>

<div class="tilt-layer" id="tilt">
    <div class="breathe-layer">
        <div class="spin-layer" id="card">
            <img src="card_image.png" id="card-img" class="card-image">
        </div>
    </div>
</div>

<div class="text-container">
    <h1 id="main-title" style="margin:0;font-size:2rem;">
        Erik 祝大家新年快樂
    </h1>
    <p id="sub-title" style="opacity:0.8;">
        Happy Lunar New Year
    </p>
</div>

<script>
const tilt = document.getElementById('tilt');
const card = document.getElementById('card');
const cardImg = document.getElementById('card-img');
const mainTitle = document.getElementById('main-title');
const subTitle = document.getElementById('sub-title');

const contents = [
    { img:'card_image.png', t1:'Erik 祝大家新年快樂', t2:'Happy Lunar New Year' },
    { img:'card_image_2.png', t1:'萬事如意 · 歲歲平安', t2:'Prosperity and Peace' },
    { img:'card_image_3.png', t1:'心想事成 · 福氣滿滿', t2:'May All Your Wishes Come True' }
];

let degree = 0;
let currentIndex = 0;
let sparkleCount = 0;

/* 🔥 滑鼠傾斜（獨立層，不會干擾呼吸動畫） */
document.addEventListener('mousemove', (e) => {
    const x = (e.clientX - window.innerWidth / 2) / 25;
    const y = (e.clientY - window.innerHeight / 2) / 25;
    tilt.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
});

/* 🔥 點擊旋轉（只影響 spin-layer） */
card.addEventListener('click', (e) => {

    degree += 360;
    card.style.transform = `rotateY(${degree}deg)`;

    setTimeout(() => {
        currentIndex = (currentIndex + 1) % contents.length;
        cardImg.src = contents[currentIndex].img;
        mainTitle.innerText = contents[currentIndex].t1;
        subTitle.innerText = contents[currentIndex].t2;
    }, 300);

    createFirework(e.clientX, e.clientY);
});

/* 🔥 煙火 */
function createFirework(x,y) {

    for(let i=0;i<20;i++){
        if(sparkleCount>=60) break;

        const s = document.createElement('div');
        s.className = 'sparkle';
        s.innerHTML = '✨';
        document.body.appendChild(s);
        sparkleCount++;

        const angle = Math.random()*Math.PI*2;
        const speed = 3+Math.random()*5;

        let vx = Math.cos(angle)*speed;
        let vy = Math.sin(angle)*speed-3;

        let px = x;
        let py = y;
        let opacity = 1;
        let gravity = 0.2;

        function animate(){
            px += vx;
            py += (vy+gravity);
            gravity += 0.35;
            opacity -= 0.012;

            s.style.left = px+"px";
            s.style.top = py+"px";
            s.style.opacity = opacity;
            s.style.transform = `scale(${opacity}) rotate(${px*0.5}deg)`;

            if(opacity>0){
                requestAnimationFrame(animate);
            } else {
                s.remove();
                sparkleCount--;
            }
        }

        animate();
    }
}
</script>

</body>
</html>
