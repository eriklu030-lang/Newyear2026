<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar New Year Card</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    overflow: hidden;
    perspective: 1200px;
}

/* 卡片 */
.spin-layer {
    width: 60vh;
    height: 60vh;
    margin-top: 5vh;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.25,.8,.25,1);
}

.spin-layer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 20px;
    pointer-events: none;
}

/* 文字區塊 */
.text-container {
    position: absolute;
    top: 80vh; /* 60vh 卡片 + 中間 20vh */
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: white;
    font-family: sans-serif;
    pointer-events: none;
}

#main-title {
    margin: 0;
    font-size: 2rem;
    line-height: 1;
}

#sub-title {
    margin-top: 0.5em; /* 上行高度的一半 */
    opacity: 0.85;
}

/* 煙火 */
.sparkle {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    animation: explode 600ms ease-out forwards;
}

@keyframes explode {
    to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="spin-layer" id="card">
    <img id="card-img" src="card_image.png">
</div>

<div class="text-container">
    <h1 id="main-title">Erik 祝大家新年快樂</h1>
    <p id="sub-title">Happy Lunar New Year</p>
</div>
