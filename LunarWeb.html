<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik's New Year Card</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0202;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 2000px; /* 3D 透視 */
        }

        .card-wrapper {
            height: 60vh;
            cursor: pointer;
            /* 強制硬體加速，防止動畫不回饋 */
            transform: rotateY(0deg) translateZ(0); 
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .card-image {
            height: 100%;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            pointer-events: none;
            display: block;
        }

        .text-container {
            margin-top: 3vh;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="card-wrapper" id="card">
        <img src="card_image.png" alt="Card" class="card-image">
    </div>

    <div class="text-container">
        <h1 style="margin: 0; font-size: 2rem;">Erik 祝大家新年快樂</h1>
        <p style="opacity: 0.8;">Happy Lunar New Year</p>
    </div>

    <script>
        const card = document.getElementById('card');
        let degree = 0;

        card.addEventListener('click', () => {
            // 每次點擊增加 360 度，確保瀏覽器偵測到數值變化
            degree += 360;
            card.style.transform = `rotateY(${degree}deg) translateZ(0)`;
        });
    </script>
</body>
</html>
