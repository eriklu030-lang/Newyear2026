<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Spin Card</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    overflow: hidden;
    perspective: 1200px;
}

/* 3D 卡片 */
.spin-layer {
    width: 60vh;
    height: 60vh;
    margin-top: 5vh;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.25,.8,.25,1);
}

.spin-layer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 20px;
    pointer-events: none;
}

/* 文字區塊 */
.text-container {
    position: absolute;
    top: 80vh; /* 60vh 卡片 + 20vh 中間 */
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: white;
    font-family: sans-serif;
    pointer-events: none;
}

#main-title {
    margin: 0;
    font-size: 2rem;
    line-height: 1;
}

#sub-title {
    margin-top: 0.5em; /* 上面字高度的一半 */
    opacity: 0.8;
}

/* 煙火 */
.sparkle {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    animation: explode 600ms ease-out forwards;
}

@keyframes explode {
    to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="spin-layer" id="card">
    <img id="card-img" src="https://picsum.photos/800/800?random=1">
</div>

<div class="text-container">
    <h1 id="main-title">主標題</h1>
    <p id="sub-title">副標題</p>
</div>

<script>
const card = document.getElementById('card');
const cardImg = document.getElementById('card-img');
const mainTitle = document.getElementById('main-title');
const subTitle = document.getElementById('sub-title');

let degree = 0;
let currentIndex = 0;

/* 內容資料 */
const contents = [
    { img: "https://picsum.photos/800/800?random=1", t1: "第一張", t2: "這是副標題 1" },
    { img: "https://picsum.photos/800/800?random=2", t1: "第二張", t2: "這是副標題 2" },
    { img: "https://picsum.photos/800/800?random=3", t1: "第三張", t2: "這是副標題 3" }
];

/* 整頁點擊翻轉 */
document.addEventListener('click', (e) => {

    if (e.target.classList.contains('sparkle')) return;

    degree += 360;
    card.style.transform = `rotateY(${degree}deg)`;

    setTimeout(() => {
        currentIndex = (currentIndex + 1) % contents.length;
        cardImg.src = contents[currentIndex].img;
        mainTitle.innerText = contents[currentIndex].t1;
        subTitle.innerText = contents[currentIndex].t2;
    }, 500);

    createFirework(e.clientX, e.clientY);
});

/* 滑鼠 tilt 效果 */
document.addEventListener('mousemove', (e) => {

    const x = (e.clientX / window.innerWidth - 0.5) * 20;
    const y = (e.clientY / window.innerHeight - 0.5) * -20;

    card.style.transform =
        `rotateY(${degree}deg) rotateX(${y}deg) rotateY(${x}deg)`;
});

/* 煙火 */
function createFirework(x, y) {
    for (let i = 0; i < 15; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = x + 'px';
        sparkle.style.top = y + 'px';
        sparkle.style.background = `hsl(${Math.random() * 360},100%,60%)`;

        const angle = Math.random() * 2 * Math.PI;
        const distance = Math.random() * 80 + 40;

        sparkle.style.setProperty('--x', Math.cos(angle) * distance + 'px');
        sparkle.style.setProperty('--y', Math.sin(angle) * distance + 'px');

        document.body.appendChild(sparkle);

        setTimeout(() => sparkle.remove(), 600);
    }
}
</script>

</body>
</html>
