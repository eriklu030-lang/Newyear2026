<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik's New Year Card</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0202;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 2000px;
        }

        /* 1. 最外層：滑鼠跟隨層 */
        .mouse-tracker {
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out; /* 讓滑鼠跟隨有一點點緩衝 */
            will-change: transform;
        }

        /* 2. 中間層：自動呼吸層 */
        .idle-container {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: breathe 6s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        @keyframes breathe {
            0% { transform: rotateY(-5deg) rotateX(2deg); }
            50% { transform: rotateY(5deg) rotateX(-2deg); }
            100% { transform: rotateY(-5deg) rotateX(2deg); }
        }

        /* 3. 最內層：點擊旋轉層 */
        .card-wrapper {
            height: 60vh;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        .card-image {
            height: 100%;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            pointer-events: none;
            display: block;
        }

        .text-container {
            margin-top: 3vh;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="mouse-tracker" id="mouse-layer">
        <div class="idle-container">
            <div class="card-wrapper" id="card">
                <img src="card_image.png" id="card-img" alt="Card" class="card-image">
            </div>
        </div>
    </div>

    <div class="text-container">
        <h1 id="main-title" style="margin: 0; font-size: 2rem;">Erik 祝大家新年快樂</h1>
        <p id="sub-title" style="opacity: 0.8;">Happy Lunar New Year</p>
    </div>

    <script>
        const mouseLayer = document.getElementById('mouse-layer');
        const card = document.getElementById('card');
        const cardImg = document.getElementById('card-img');
        const mainTitle = document.getElementById('main-title');
        const subTitle = document.getElementById('sub-title');

        const contents = [
            { img: 'card_image.png', t1: 'Erik 祝大家新年快樂', t2: 'Happy Lunar New Year' },
            { img: 'card_image_2.png', t1: '萬事如意 · 歲歲平安', t2: 'Prosperity and Peace' },
            { img: 'card_image_3.png', t1: '心想事成 · 福氣滿滿', t2: 'May All Your Wishes Come True' }
        ];

        let degree = 0;
        let currentIndex = 0;
        let sparkleCount = 0;

        // 滑鼠跟隨邏輯 (作用在最外層)
        document.addEventListener('mousemove', (e) => {
            const xVal = (e.clientX - window.innerWidth / 2) / 30;
            const yVal = (e.clientY - window.innerHeight / 2) / 30;
            mouseLayer.style.transform = `rotateY(${xVal}deg) rotateX(${-yVal}deg)`;
        });

        // 點擊旋轉邏輯 (作用在最內層)
        card.addEventListener('click', (e) => {
            degree += 360;
            card.style.transform = `rotateY(${degree}deg)`;

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % contents.length;
                cardImg.src = contents[currentIndex].img;
                mainTitle.innerText = contents[currentIndex].t1;
                subTitle.innerText = contents[currentIndex].t2;
            }, 250);

            createFirework(e.clientX, e.clientY);
        });
