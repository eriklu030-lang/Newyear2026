<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik's New Year Card</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0202;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 2000px;
        }

        .card-wrapper {
            height: 60vh;
            cursor: pointer;
            /* 核心：只使用最穩定的 CSS 旋轉邏輯 */
            transform: rotateY(0deg) translateZ(0); 
            transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
            will-change: transform;
        }

        .card-image {
            height: 100%;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            pointer-events: none;
            display: block;
        }

        .text-container {
            margin-top: 3vh;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="card-wrapper" id="card">
        <img src="card_image.png" id="card-img" alt="Card" class="card-image">
    </div>

    <div class="text-container">
        <h1 id="main-title" style="margin: 0; font-size: 2rem;">Erik 祝大家新年快樂</h1>
        <p id="sub-title" style="opacity: 0.8;">Happy Lunar New Year</p>
    </div>

    <script>
        const card = document.getElementById('card');
        const cardImg = document.getElementById('card-img');
        const mainTitle = document.getElementById('main-title');
        const subTitle = document.getElementById('sub-title');

        const contents = [
            { img: 'card_image.png', t1: '新年快樂 · 爆冷成功', t2: 'Happy Lunar New Year' },
            { img: 'card_image_2.png', t1: '萬事如意 · 歲歲平安', t2: 'Prosperity and Peace' },
            { img: 'card_image_3.png', t1: '心想事成 · 福氣滿滿', t2: 'May All Your Wishes Come True' }
        ];

        let degree = 0;
        let currentIndex = 0;
        let sparkleCount = 0;

        card.addEventListener('click', (e) => {
            // 1. 旋轉門效果：每次點擊累加 360 度
            degree += 360;
            card.style.transform = `rotateY(${degree}deg) translateZ(0)`;

            // 2. 內容切換：在轉到一半時悄悄更換
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % contents.length;
                cardImg.src = contents[currentIndex].img;
                mainTitle.innerText = contents[currentIndex].t1;
                subTitle.innerText = contents[currentIndex].t2;
            }, 250);

            // 3. ✨ 煙火噴發 (嚴格遵守物理參數)
            createFirework(e.clientX, e.clientY);
        });

        function createFirework(x, y) {
            const amount = 20; 
            for (let i = 0; i < amount; i++) {
                if (sparkleCount >= 50) break; 
                
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerHTML = '✨';
                document.body.appendChild(sparkle);
                sparkleCount++;

                const angle = Math.random() * Math.PI * 2;
                const velocity = 2.5 + Math.random() * 5; // 速度減半
                let vx = Math.cos(angle) * velocity;
                let vy = Math.sin(angle) * velocity - 3; 
                let posX = x;
                let posY = y;
                let opacity = 1;
                let gravity = 0.2; 

                function animateSparkle() {
                    posX += vx;
                    posY += (vy + gravity);
                    gravity += 0.35; // 加強重力感
                    opacity -= 0.01; // 顯示時間兩倍

                    sparkle.style.left = posX + 'px';
                    sparkle.style.top = posY + 'px';
                    sparkle.style.opacity = opacity;
                    sparkle.style.transform = `scale(${opacity}) rotate(${posX * 0.5}deg)`;

                    if (opacity > 0) {
                        requestAnimationFrame(animateSparkle);
                    } else {
                        sparkle.remove();
                        sparkleCount--;
                    }
                }
                animateSparkle();
            }
        }
    </script>
</body>
</html>
