<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik's New Year Card</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0202;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 2000px;
        }

        .card-wrapper {
            height: 60vh;
            cursor: pointer;
            /* 移除 transition 避免與 JS 實時跟隨衝突，改由 JS 控制平滑度 */
            transform: rotateY(0deg) rotateX(0deg) translateZ(0); 
            transform-style: preserve-3d;
            will-change: transform;
        }

        .card-image {
            height: 100%;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            pointer-events: none;
            display: block;
        }

        .text-container {
            margin-top: 3vh;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 24px;
        }
    </style>
</head>
