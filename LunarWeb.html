<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik 的新年祝福</title>
    <style>
        :root {
            --bg-color: #0d0202; 
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: sans-serif;
            overflow: hidden; 
            perspective: 2000px;
        }

        .card-wrapper {
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            cursor: pointer;
            /* 移除之前的 JS 動態干擾，改用 CSS 過渡 */
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 旋轉類別：當 JS 加入這個 class 時觸發旋轉 */
        .spinning {
            transform: rotateY(360deg);
        }

        .card-image {
            height: 100%;
            width: auto;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .text-container {
            margin-top: 3vh;
            text-align: center;
            color: var(--text-color);
            pointer-events: none;
        }

        .title { font-size: 2rem; font-weight: bold; margin-bottom: 10px; }
        .subtitle { font-size: 1.2rem; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="card-wrapper" id="card">
        <img src="card_image.png" alt="Card" class="card-image">
    </div>

    <div class="text-container">
        <div class="title">Erik 祝大家新年快樂</div>
        <div class="subtitle">Happy Lunar New Year</div>
    </div>
