<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik 的新年祝福</title>
    <style>
        :root {
            --bg-color: #0d0202; 
            --text-color: #ffffff;
            --accent-color: #d4af37; /* 金色 */
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            overflow: hidden; 
            perspective: 1000px;
        }

        /* 3D 卡片容器 */
        .card-wrapper {
            height: 60vh;
            width: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            z-index: 2;
        }

        .card-image {
            height: 100%;
            width: auto;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* 文字區塊 */
        .text-container {
            margin-top: 3vh;
            text-align: center;
            color: var(--text-color);
            width: 80vw;
            z-index: 1;
        }

        .title {
            font-size: clamp(1.2rem, 6vw, 2.2rem);
            font-weight: bold;
            margin-bottom: 1vh;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: clamp(0.9rem, 4vw, 1.3rem);
            opacity: 0.8;
            font-weight: 300;
        }

        /* 修正後的啟動按鈕：放在底部正中央且顏色醒目 */
        #permission-btn {
            position: fixed;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>

    <div class="card-wrapper" id="card">
        <img src="card_image.png" alt="Erik's New Year Card" class="card-image">
    </div>

    <div class="text-container">
        <div class="title">Erik 祝大家新年快樂</div>
        <div class="subtitle">Happy Lunar New Year</div>
    </div>

    <button id="permission-btn">點擊開啟動態祝福</button>

    <script>
        const card = document.getElementById('card');
        const btn = document.getElementById('permission-btn');

        // 電腦端鼠標控制
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 15;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            applyRotation(xAxis, yAxis);
        });

        // 手機端陀螺儀控制
        function handleOrientation(event) {
            let yAxis = event.beta;  // 上下
            let xAxis = event.gamma; // 左右

            let rotateY = Math.max(Math.min(xAxis, 30), -30);
            let rotateX = Math.max(Math.min(yAxis - 50, 10), -10); // 扣除一般拿手機的斜角

            card.style.transform = `rotateY(${rotateY}deg) rotateX(${-rotateX}deg)`;
        }

        function applyRotation(x, y) {
            const rotateY = Math.max(Math.min(x, 30), -30);
            const rotateX = Math.max(Math.min(-y, 10), -10);
            card.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;
        }

        // 啟動按鈕與 iOS 權限請求
        btn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            btn.style.display = 'none';
                        }
                    })
                    .catch(e => {
                        console.error(e);
                        btn.innerText = "請允許感應器權限";
                    });
            } else {
                // Android 或非 iOS 13 設備
                window.addEventListener('deviceorientation', handleOrientation);
                btn.style.display = 'none';
            }
        });

        // 滑鼠離開回正
        document.addEventListener('mouseleave', () => {
            card.style.transition = "transform 0.5s ease";
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
