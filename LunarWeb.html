<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik 的新年祝福</title>
    <style>
        :root {
            --bg-color: #0d0202; 
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            overflow: hidden; 
            perspective: 2000px;
            touch-action: manipulation;
        }

        .card-wrapper {
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            z-index: 2;
            cursor: pointer;
        }

        .card-image {
            height: 100%;
            width: auto;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .text-container {
            margin-top: 3vh;
            text-align: center;
            color: var(--text-color);
            width: 80vw;
            pointer-events: none;
        }

        .title { font-size: clamp(1.2rem, 6vw, 2.2rem); font-weight: bold; margin-bottom: 1vh; }
        .subtitle { font-size: clamp(0.9rem, 4vw, 1.3rem); opacity: 0.8; font-weight: 300; }

        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 24px;
        }
    </style>
</head>
<body>
