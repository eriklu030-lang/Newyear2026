<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik 的新年祝福</title>
    <style>
        :root {
            --bg-color: #0d0202; 
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            overflow: hidden; 
            perspective: 1000px;
            touch-action: manipulation; /* 優化手機點擊 */
        }

        .card-wrapper {
            height: 60vh;
            width: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            z-index: 2;
            cursor: pointer;
        }

        .card-image {
            height: 100%;
            width: auto;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            pointer-events: none;
            user-select: none;
        }

        .text-container {
            margin-top: 3vh;
            text-align: center;
            color: var(--text-color);
            width: 80vw;
            z-index: 1;
            pointer-events: none;
        }

        .title {
            font-size: clamp(1.2rem, 6vw, 2.2rem);
            font-weight: bold;
            margin-bottom: 1vh;
        }

        .subtitle {
            font-size: clamp(0.9rem, 4vw, 1.3rem);
            opacity: 0.8;
            font-weight: 300;
        }

        /* ✨ Emoji 粒子樣式 */
        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 24px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="card-wrapper" id="card">
        <img src="card_image.png" id="card-img" alt="Erik's New Year Card" class="card-image">
    </div>

    <div class="text-container">
        <div class="title">Erik 祝大家新年快樂</div>
        <div class="subtitle">Happy Lunar New Year</div>
    </div>

    <script>
        const card = document.getElementById('card');
        const cardImg = document.getElementById('card-img');
        
        // 設定圖片陣列（請確保 GitHub 上有這三個檔案）
        const images = ['card_image.png', 'card_image_2.png', 'card_image_3.png'];
        let currentIndex = 0;
        let permissionGranted = false;

        // 1. 點擊卡片：噴射特效 + 切換圖片 + 啟動 iOS 權限
        card.addEventListener('click', (e) => {
            createFirework(e.clientX, e.clientY);
            
            // 切換圖片
            currentIndex = (currentIndex + 1) % images.length;
            cardImg.src = images[currentIndex];

            // 請求陀螺儀權限（僅 iOS 需要）
            if (!permissionGranted && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') {
                            permissionGranted = true;
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                    });
            } else if (!permissionGranted) {
                window.addEventListener('deviceorientation', handleOrientation);
                permissionGranted = true;
            }
        });

        // 2. ✨ Emoji 煙火特效
        function createFirework(x, y) {
            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerHTML = '✨';
                document.body.appendChild(sparkle);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 5 + Math.random() * 10;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity - 5; // 初始向上噴
                
                let posX = x;
                let posY = y;
                let opacity = 1;
                let gravity = 0.3;

                function animate() {
                    posX += vx;
                    posY += (vy + gravity);
                    gravity += 0.2; // 模擬重力加速度
                    opacity -= 0.02;

                    sparkle.style.left = posX + 'px';
                    sparkle.style.top = posY + 'px';
                    sparkle.style.opacity = opacity;
                    sparkle.style.transform = `scale(${opacity}) rotate(${posX}deg)`;

                    if (opacity > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        sparkle.remove();
                    }
                }
                animate();
            }
        }

        // 3. 3D 旋轉控制 (滑鼠 & 陀螺儀)
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 15;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${Math.max(Math.min(xAxis, 30), -30)}deg) rotateX(${Math.max(Math.min(-yAxis, 10), -10)}deg)`;
        });

        function handleOrientation(event) {
            let yAxis = event.beta; 
            let xAxis = event.gamma; 
            let rotateY = Math.max(Math.min(xAxis, 30), -30);
            let rotateX = Math.max(Math.min(yAxis - 50, 10), -10);
            card.style.transform = `rotateY(${rotateY}deg) rotateX(${-rotateX}deg)`;
        }

        document.addEventListener('mouseleave', () => {
            card.style.transition = "transform 0.5s ease";
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
