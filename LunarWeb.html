<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik's New Year Card</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0202;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 2000px;
        }

        /* 1. 外層容器：負責自動呼吸擺動 */
        .idle-container {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: breathe 6s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        @keyframes breathe {
            0% { transform: rotateY(-5deg) rotateX(2deg); }
            50% { transform: rotateY(5deg) rotateX(-2deg); }
            100% { transform: rotateY(-5deg) rotateX(2deg); }
        }

        /* 2. 內層卡片：負責點擊 360 度旋轉 */
        .card-wrapper {
            height: 60vh;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        .card-image {
            height: 100%;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            pointer-events: none;
            display: block;
        }

        .text-container {
            margin-top: 3vh;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="idle-container">
        <div class="card-wrapper" id="card">
            <img src="card_image.png" id="card-img" alt="Card" class="card-image">
        </div>
    </div>

    <div class="text-container">
        <h1 id="main-title" style="margin: 0; font-size: 2rem;">Erik 祝大家新年快樂</h1>
        <p id="sub-title" style="opacity: 0.8;">Happy Lunar New Year</p>
    </div>

    <script>
        const card = document.getElementById('card');
        const cardImg = document.getElementById('card-img');
        const mainTitle = document.getElementById('main-title');
        const subTitle = document.getElementById('sub-title');

        const contents = [
            { img: 'card_image.png', t1: 'Erik 祝大家新年快樂', t2: 'Happy Lunar New Year' },
            { img: 'card_image_2.png', t1: '萬事如意 · 歲歲平安', t2: 'Prosperity and Peace' },
            { img: 'card_image_3.png', t1: '心想事成 · 福氣滿滿', t2: 'May All Your Wishes Come True' }
        ];

        let degree = 0;
        let currentIndex = 0;
        let sparkleCount = 0;

        card.addEventListener('click', (e) => {
            // 點擊旋轉 360 度 (發生在內層，不會被外層動畫覆蓋)
            degree += 360;
            card.style.transform = `rotateY(${degree}deg) translateZ(0)`;

            // 切換內容
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % contents.length;
                cardImg.src = contents[currentIndex].img;
                mainTitle.innerText = contents[currentIndex].t1;
                subTitle.innerText = contents[currentIndex].t2;
            }, 250);

            createFirework(e.clientX, e.clientY);
        });

        // ✨ 煙火邏輯 (維持物理參數)
        function createFirework(x, y) {
            for (let i = 0; i < 20; i++) {
                if (sparkleCount >= 50) break;
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerHTML = '✨';
                document.body.appendChild(sparkle);
                sparkleCount++;

                const angle = Math.random() * Math.PI * 2;
                const velocity = 2.5 + Math.random() * 5; 
                let vx = Math.cos(angle) * velocity;
                let vy = Math.sin(angle) * velocity - 3; 
                let posX = x;
                let posY = y;
                let opacity = 1;
                let gravity = 0.2;

                function animateSparkle() {
                    posX += vx;
                    posY += (vy + gravity);
                    gravity += 0.35; 
                    opacity -= 0.01; 
                    sparkle.style.left = posX + 'px';
                    sparkle.style.top = posY + 'px';
                    sparkle.style.opacity = opacity;
                    sparkle.style.transform = `scale(${opacity}) rotate(${posX * 0.5}deg)`;
                    if (opacity > 0) { requestAnimationFrame(animateSparkle); } else { sparkle.remove(); sparkleCount--; }
                }
                animateSparkle();
            }
        }
    </script>
</body>
</html>
