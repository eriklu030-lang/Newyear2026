<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erik's New Year Card</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0202;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 2000px;
        }

        /* 呼吸動畫定義 */
        @keyframes breatheRotation {
            0% { transform: rotateY(-5deg) rotateX(2deg); }
            50% { transform: rotateY(5deg) rotateX(-2deg); }
            100% { transform: rotateY(-5deg) rotateX(2deg); }
        }

        .card-wrapper {
            height: 60vh;
            cursor: pointer;
            transform-style: preserve-3d;
            will-change: transform;
            /* 預設維持一個微小的旋轉狀態，並交由 JS 控制點擊旋轉 */
            transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* 當沒有在旋轉時，加入一個自動擺動的容器效果 */
        .card-idle {
            animation: breatheRotation 6s ease-in-out infinite;
        }

        .card-image {
            height: 100%;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            pointer-events: none;
            display: block;
        }

        .text-container {
            margin-top: 3vh;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="card-wrapper card-idle" id="card">
        <img src="card_image.png" id="card-img" alt="Card" class="card-image">
    </div>

    <div class="text-container">
        <h1 id="main-title" style="margin: 0; font-size: 2rem;">Erik 祝大家新年快樂</h1>
        <p id="sub-title" style="opacity: 0.8;">Happy Lunar New Year</p>
    </div>

    <script>
        const card = document.getElementById('card');
        const cardImg = document.getElementById('card-img');
        const mainTitle = document.getElementById('main-title');
        const subTitle = document.getElementById('sub-title');

        const contents = [
            { img: 'card_image.png', t1: 'Erik 祝大家新年快樂', t2: 'Happy Lunar New Year' },
            { img: 'card_image_2.png', t1: '萬事如意 · 歲歲平安', t2: 'Prosperity and Peace' },
            { img: 'card_image_3.png', t1: '心想事成 · 福氣滿滿', t2: 'May All Your Wishes Come True' }
        ];

        let degree = 0;
        let currentIndex = 0;
        let sparkleCount = 0;

        card.addEventListener('click', (e) => {
            // 點擊時暫時移除自動呼吸動畫，避免衝突
            card.classList.remove('card-idle');

            degree += 360;
            card.style.transform = `rotateY(${degree}deg) translateZ(0)`;

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % contents.length;
                cardImg.src = contents[currentIndex].img;
                mainTitle.innerText = contents[currentIndex].t1;
                subTitle.innerText = contents[currentIndex].t2;
            }, 250);

            // 大旋轉結束後，把自動呼吸加回來，但要保持目前的旋轉角度
            setTimeout(() => {
                // 如果需要轉完後繼續呼吸，這裡可以再加邏輯，
                // 但為了穩定性，目前設計為點擊後維持在該角度，或者你希望它繼續擺動？
            }, 1200);

            createFirework(e.clientX, e.clientY);
        });
